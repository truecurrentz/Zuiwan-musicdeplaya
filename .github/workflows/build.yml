name: Build Zuiwan

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: zuiwan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK Licenses and Prepare Keystore
        env:
          SECRET_KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi
          chmod +x gradlew
          if [ -n "$SECRET_KEYSTORE" ]; then
            mkdir -p app/keystore
            echo "$SECRET_KEYSTORE" | base64 -d > app/keystore/release.jks
          else
            keytool -list -keystore app/signing/zuiwan.p12 -storepass zuiwan123
          fi

      - name: Build Debug and Release APKs
        run: |
          set +e
          ./gradlew --console=plain assembleDebug assembleRelease 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            python3 -c 'import pathlib; lines = pathlib.Path("build.log").read_text(errors="replace").splitlines(); kt = [l for l in lines if l.startswith("e:")]; msg = "\n".join(kt[:50] if kt else lines[-65:])[:3800].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print(f"::error title=GradleBuild::{msg}")'
            exit "$STATUS"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Zuiwan-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/Zuiwan.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs dist/Zuiwan.apk
            "$APKSIGNER" verify --verbose --print-certs dist/Zuiwan-debug.apk
          fi
          ls -lh dist/

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: Zuiwan-release
          path: dist/Zuiwan.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Zuiwan-debug
          path: dist/Zuiwan-debug.apk
